spack:
  specs:
  - tula-downstream@0.1.0 ^tula-lib-a flavor=vanilla ^tula-lib-b flavor=fast ^tula-perflibs+openmp
  concretizer:
    unify: true

  view:
    default:
      root: .spack-view
      link: roots

  develop:
    tula-cmake:
      spec: tula-cmake@3.2.0
      path: ../../../../
    tula-lib-a:
      spec: tula-lib-a@0.1.0
      path: ../../../../tests/fixtures/spack/tula_lib_a
    tula-lib-b:
      spec: tula-lib-b@0.1.0
      path: ../../../../tests/fixtures/spack/tula_lib_b
    tula-perflibs:
      spec: tula-perflibs@0.1.0
      path: ../../../../packages/tula_perflibs
    tula-boilerplate:
      spec: tula-boilerplate@0.1.0
      path: ../../../../examples/tula_boilerplate
    tula-downstream:
      spec: tula-downstream@0.1.0
      path: ../../../../examples/tula_downstream
