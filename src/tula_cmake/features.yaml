formatting:
  modes: [conan, cpm, system]
  dependencies: []
  conan_requires:
    - fmt/11.2.0
  cmake_module: TulaPackage.cmake
  resolver: tula_resolve_package
  cmake_vars:
    PACKAGE_NAME: fmt
    TARGET_CANDIDATES: [fmt::fmt-header-only, fmt::fmt]
    CPM_NAME: fmt
    CPM_URL: https://github.com/fmtlib/fmt/archive/refs/tags/11.2.0.tar.gz
    CPM_SHA256: bc23066d87ab3168f27cef3e97d545fa63314f5c79df5ea444d41d56f962c6af
    CPM_OPTIONS: [FMT_TEST OFF, FMT_DOC OFF, FMT_INSTALL OFF]

logging:
  modes: [conan, cpm, system]
  dependencies: [formatting]
  conan_requires:
    - spdlog/1.15.3
  cmake_module: TulaLogging.cmake
  resolver: tula_resolve_logging
  cmake_vars:
    SPDLOG_URL: https://github.com/gabime/spdlog/archive/refs/tags/v1.15.3.tar.gz
    SPDLOG_SHA256: 15a04e69c222eb6c01094b5c7ff8a249b36bb22788d72519646fb85feb267e67
