# TulaCMake Test Configuration
# Tests are first-class entities decoupled from packages

# Global settings
global:
  timeout_seconds: 300
  build_configs: [Debug]   # Release adds time; run Debug only unless specifically needed
  parallel_jobs: 4
  continue_on_failure: true

# Test definitions - each test is independent
tests:

  # ── Eigen3 ─────────────────────────────────────────────────────────────────
  eigen3_conan:
    name: "Eigen3 CONAN"
    description: "Eigen3 via Conan"
    packages:
      Eigen3: conan
    cmake_vars: {}

  eigen3_cpm:
    name: "Eigen3 CPM"
    description: "Eigen3 via CPM"
    packages:
      Eigen3: cpm
    cmake_vars: {}

  eigen3_system:
    name: "Eigen3 SYSTEM"
    description: "Eigen3 from system (libeigen3-dev)"
    packages:
      Eigen3: system
    cmake_vars: {}

  # ── logging (spdlog + fmt) ─────────────────────────────────────────────────
  logging_conan:
    name: "logging CONAN"
    description: "spdlog + fmt via Conan (1.15.3 + fmt 11)"
    packages:
      logging: conan
    cmake_vars: {}

  logging_cpm:
    name: "logging CPM"
    description: "spdlog from CPM source"
    packages:
      logging: cpm
    cmake_vars: {}
    timeout_seconds: 600

  logging_system:
    name: "logging SYSTEM"
    description: "spdlog from system (libspdlog-dev)"
    packages:
      logging: system
    cmake_vars: {}

  # ── Yaml ───────────────────────────────────────────────────────────────────
  yaml_conan:
    name: "Yaml CONAN"
    description: "yaml-cpp via Conan"
    packages:
      Yaml: conan
    cmake_vars: {}

  yaml_cpm:
    name: "Yaml CPM"
    description: "yaml-cpp via CPM"
    packages:
      Yaml: cpm
    cmake_vars: {}
    timeout_seconds: 600

  yaml_system:
    name: "Yaml SYSTEM"
    description: "yaml-cpp from system (libyaml-cpp-dev)"
    packages:
      Yaml: system
    cmake_vars: {}

  # ── testing (GTest + benchmark) ────────────────────────────────────────────
  testing_conan:
    name: "testing CONAN"
    description: "GTest + Google Benchmark via Conan"
    packages:
      testing: conan
    cmake_vars: {}

  testing_cpm:
    name: "testing CPM"
    description: "GTest + Benchmark via CPM"
    packages:
      testing: cpm
    cmake_vars: {}
    timeout_seconds: 600

  testing_system:
    name: "testing SYSTEM"
    description: "GTest from system (libgtest-dev)"
    packages:
      testing: system
    cmake_vars: {}

  # ── Clipp ──────────────────────────────────────────────────────────────────
  clipp_conan:
    name: "Clipp CONAN"
    description: "CLI parser via Conan"
    packages:
      Clipp: conan
    cmake_vars: {}

  clipp_cpm:
    name: "Clipp CPM"
    description: "CLI parser via CPM"
    packages:
      Clipp: cpm
    cmake_vars: {}

  # ── Spectra ────────────────────────────────────────────────────────────────
  spectra_conan:
    name: "Spectra CONAN"
    description: "Eigenvalue solver via Conan"
    packages:
      Eigen3: conan
      Spectra: conan
    cmake_vars: {}

  spectra_cpm:
    name: "Spectra CPM"
    description: "Eigenvalue solver via CPM; Eigen3 from system to avoid toolchain-phase ordering"
    packages:
      Eigen3: system
      Spectra: cpm
    cmake_vars: {}
    timeout_seconds: 600

  # ── Ceres ──────────────────────────────────────────────────────────────────
  ceres_conan:
    name: "Ceres CONAN"
    description: "Nonlinear least squares via Conan"
    # No pre-built Conan binary for ceres-solver/2.2.0 on ARM64+GCC14;
    # builds from source fail on Eigen NEON SIMD code. ceres_system covers this.
    enabled: false
    packages:
      Eigen3: conan
      Ceres: conan
    cmake_vars: {}

  ceres_system:
    name: "Ceres SYSTEM"
    description: "Ceres from system (libceres-dev)"
    packages:
      Eigen3: system
      Ceres: system
    cmake_vars: {}

  # ── NetCDF ─────────────────────────────────────────────────────────────────
  netcdf_conan:
    name: "NetCDF CONAN"
    description: "NetCDF C library via Conan"
    packages:
      NetCDF: conan
    cmake_vars: {}
    timeout_seconds: 600

  netcdf_system:
    name: "NetCDF SYSTEM"
    description: "NetCDF from system (libnetcdf-dev)"
    packages:
      NetCDF: system
    cmake_vars: {}

  # ── NetCDFCXX4 ─────────────────────────────────────────────────────────────
  netcdf_cxx4_system:
    name: "NetCDFCXX4 SYSTEM"
    description: "NetCDF C++ bindings from system"
    packages:
      NetCDF: system
      NetCDFCXX4: system
    cmake_vars: {}

  netcdf_cxx4_cpm:
    name: "NetCDFCXX4 CPM"
    description: "NetCDF C++ bindings from CPM (builds from source)"
    packages:
      NetCDF: system
      NetCDFCXX4: cpm
    cmake_vars: {}
    timeout_seconds: 600

  # ── Csv ────────────────────────────────────────────────────────────────────
  csv_cpm:
    name: "Csv CPM"
    description: "CSV parser via CPM"
    packages:
      Csv: cpm
    cmake_vars: {}

  # ── Enum ───────────────────────────────────────────────────────────────────
  enum_cpm:
    name: "Enum CPM"
    description: "meta_enum + bitmask via CPM"
    packages:
      Enum: cpm
    cmake_vars: {}

  # ── Grppi ──────────────────────────────────────────────────────────────────
  grppi_cpm:
    name: "GrPPI CPM"
    description: "Generic parallel patterns via CPM"
    packages:
      perflibs: system
      Grppi: cpm
    cmake_vars: {}

  # ── perflibs ───────────────────────────────────────────────────────────────
  perflibs_system:
    name: "perflibs SYSTEM"
    description: "OpenMP + Threads (system)"
    packages:
      perflibs: system
    cmake_vars: {}

  # ── Integration / mixed ────────────────────────────────────────────────────
  eigen3_no_threading:
    name: "Eigen3 no threading"
    description: "Eigen3 without multithreading flag"
    packages:
      Eigen3: conan
    cmake_vars:
      USE_EIGEN3_MULTITHREADING: "OFF"

  mixed_conan_cpm:
    name: "Mixed CONAN+CPM"
    description: "Eigen3 (CONAN) + Clipp (CPM)"
    packages:
      Eigen3: conan
      Clipp: cpm
    cmake_vars: {}

  mixed_system_cpm:
    name: "Mixed SYSTEM+CPM"
    description: "Eigen3 (SYSTEM) + Yaml (CPM)"
    packages:
      Eigen3: system
      Yaml: cpm
    cmake_vars: {}
    timeout_seconds: 600

# Test groups for batch execution
test_groups:
  quick:
    description: "Quick smoke test (~5 min)"
    tests:
      - eigen3_conan
      - yaml_conan
      - logging_conan
      - clipp_cpm
      - perflibs_system

  conan_all:
    description: "All CONAN mode tests"
    tests:
      - eigen3_conan
      - logging_conan
      - yaml_conan
      - testing_conan
      - clipp_conan
      - spectra_conan
      - ceres_conan
      - netcdf_conan

  cpm_all:
    description: "All CPM mode tests"
    tests:
      - eigen3_cpm
      - logging_cpm
      - yaml_cpm
      - testing_cpm
      - clipp_cpm
      - spectra_cpm
      - netcdf_cxx4_cpm
      - csv_cpm
      - enum_cpm
      - grppi_cpm

  system_all:
    description: "All SYSTEM mode tests"
    tests:
      - eigen3_system
      - logging_system
      - yaml_system
      - testing_system
      - ceres_system
      - netcdf_system
      - netcdf_cxx4_system
      - perflibs_system

  integration:
    description: "Multi-package integration tests"
    tests:
      - spectra_conan
      - spectra_cpm
      - ceres_conan
      - ceres_system
      - netcdf_cxx4_system
      - netcdf_cxx4_cpm
      - mixed_conan_cpm
      - mixed_system_cpm

  full:
    description: "All enabled tests"
    tests: "all"

# Package metadata
package_info:
  Eigen3:
    conan_name: "eigen"
    cmake_target: "Eigen3::Eigen"
    supported_modes: [CONAN, CPM, SYSTEM]
    system_package: "libeigen3-dev"

  Spectra:
    conan_name: "spectra"
    cmake_target: "Spectra::Spectra"
    supported_modes: [CONAN, CPM]
    depends_on: [Eigen3]
    note: "SYSTEM not available on ubuntu/noble"

  Yaml:
    conan_name: "yaml-cpp"
    cmake_target: "yaml-cpp::yaml-cpp"
    supported_modes: [CONAN, CPM, SYSTEM]
    system_package: "libyaml-cpp-dev"

  logging:
    conan_name: "spdlog"
    note: "Metapackage: spdlog + fmt"
    supported_modes: [CONAN, CPM, SYSTEM]
    system_package: "libspdlog-dev"

  testing:
    conan_name: "gtest + benchmark"
    note: "Metapackage: GTest + benchmark"
    supported_modes: [CONAN, CPM, SYSTEM]
    system_package: "libgtest-dev"

  Clipp:
    conan_name: "clipp"
    supported_modes: [CONAN, CPM]
    note: "SYSTEM not available on ubuntu/noble"

  Csv:
    conan_name: "csv"
    supported_modes: [CPM]

  Enum:
    conan_name: "tula-enum"
    note: "Metapackage: meta_enum + bitmask"
    supported_modes: [CPM]

  NetCDF:
    conan_name: "netcdf"
    cmake_target: "netCDF::netcdf"
    supported_modes: [CONAN, SYSTEM]
    system_package: "libnetcdf-dev"

  NetCDFCXX4:
    conan_name: "netcdf-cxx4"
    cmake_target: "netCDF::netcdf-cxx4"
    supported_modes: [CPM, SYSTEM]
    system_package: "libnetcdf-c++4-dev"
    depends_on: [NetCDF]

  Ceres:
    conan_name: "ceres-solver"
    cmake_target: "Ceres::ceres"
    supported_modes: [CONAN, SYSTEM]
    system_package: "libceres-dev"
    depends_on: [Eigen3]

  Grppi:
    conan_name: "grppi"
    supported_modes: [CPM]

  perflibs:
    conan_name: null
    note: "Metapackage: OpenMP + Threads (system-provided)"
    supported_modes: [SYSTEM]
