# Spack develop packages owned by this source repository.
# Paths are relative to the repository root.
develop:
  tula-cmake: {spec: "tula-cmake@3.2.0", path: .}
  tula-ccfits: {spec: "tula-ccfits@1.0.0", path: packages/tula_ccfits}
  tula-perflibs: {spec: "tula-perflibs@0.1.0", path: packages/tula_perflibs}
  tula-logging: {spec: "tula-logging@1.0.0", path: packages/tula_logging}
  tula-yaml-cpp: {spec: "tula-yaml-cpp@0.8.0", path: packages/tula_yaml_cpp}
  tula-eigen3: {spec: "tula-eigen3@3.4.0", path: packages/tula_eigen3}
  tula-netcdf-cxx4:
    {spec: "tula-netcdf-cxx4@4.3.1", path: packages/tula_netcdf_cxx4}
