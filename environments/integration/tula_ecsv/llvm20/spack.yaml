spack:
  include:
    - ../../../acceptance/config/repos.yaml
    - ../../../acceptance/config/devcontainer/packages.yaml

  specs:
    - tula@3.1.0+ecsv %cxx=llvm@20.1.2

  concretizer:
    unify: true
    reuse: false

  view:
    default:
      root: .spack-view
      link: roots

  develop:
    tula-cmake:
      spec: tula-cmake@3.2.0
      path: ../../../..
    tula:
      spec: tula@3.1.0
      path: ../../../../../tula
    tula-logging:
      spec: tula-logging@1.0.0
      path: ../../../../packages/tula_logging
    tula-yaml-cpp:
      spec: tula-yaml-cpp@0.8.0
      path: ../../../../packages/tula_yaml_cpp
    tula-eigen3:
      spec: tula-eigen3@3.4.0
      path: ../../../../packages/tula_eigen3

  packages:
    cxx:
      require: llvm@20.1.2
