[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "tula-cmake"
version = "3.1.0"
description = "Typed source-superbuild infrastructure for TolTEC C++ projects"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "conan>=2.31,<3",
    "pydantic>=2.12,<3",
    "pyyaml>=6",
    "typer>=0.20,<1",
]
classifiers = [
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
documentation = "https://toltec-astro.github.io/tula_cmake/"
homepage = "https://github.com/toltec-astro/tula_cmake"
issues = "https://github.com/toltec-astro/tula_cmake/issues"

[project.scripts]
tula-cmake = "tula_cmake.cli:app"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "ruff>=0.12",
    "ty>=0.0.1a15",
]
test = [
    "coverage[toml]>=7.10",
    "pytest>=8.4",
]
docs = [
    "autodoc-pydantic>=2.2",
    "myst-parser>=4",
    "sphinx>=8.2",
    "sphinx-copybutton>=0.5",
    "sphinx-book-theme>=1.1",
    "sphinxcontrib-typer>=0.7",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tula_cmake = [
    "py.typed",
    "data/registry.yaml",
    "data/projects.yaml",
    "data/cmake/infrastructure/*.cmake",
    "data/cmake/resolvers/*.cmake",
    "data/templates/*.in",
    "data/profiles/*",
    "data/recipes/*/*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
norecursedirs = [".*", "docs/_build"]
addopts = [
    "-ra",
    "-m",
    "not feature_matrix",
    "--doctest-glob=*.rst",
    "--strict-config",
    "--strict-markers",
]
markers = [
    "feature_matrix: configure, build, and run one generated feature-matrix case",
    "network: feature-matrix case which may download a Conan or CPM dependency",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "B008",
    "COM812",
    "D102",
    "D105",
    "EM101",
    "EM102",
    "ISC001",
    "PLC0415",
    "PLR0913",
    "S603",
    "SLF001",
    "T201",
    "TC003",
    "TRY003",
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "S101"]
"conanfile.py" = ["E402"]
"examples/**/conanfile.py" = ["INP001"]
"src/tula_cmake/data/recipes/**/conanfile.py" = ["INP001"]
"docs/conf.py" = ["A001", "D", "INP001", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.src]
exclude = [
    "docs/conf.py",
    "examples/**/conanfile.py",
    "src/tula_cmake/data/recipes/**/conanfile.py",
]

[tool.coverage.run]
branch = true
source = ["src/tula_cmake"]
omit = [
    "src/tula_cmake/__main__.py",
    "src/tula_cmake/recipe.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.cruft]
skip = [".git"]
