# Package definitions for tula_cmake dependency management
# Each package specifies supported modes, Conan requirements, and CMake variables

Ceres:
  modes: [conan, cpm, system]
  conan_requires:
    - ceres-solver/2.2.0
  cmake_vars:
    CPM_GITHUB_REPO: ceres-solver/ceres-solver
    CPM_GIT_TAG: "2.0.0"
    CPM_OPTIONS:
      - GLOG_PREFER_EXPORTED_GLOG_CMAKE_CONFIGURATION ON
      - MINIGLOG OFF
      - GFLAGS OFF
      - EIGENSPARSE ON
      - SUITESPARSE OFF
      - CXSPARSE OFF
      - ACCELERATESPARSE OFF
      - SCHUR_SPECIALIZATIONS ON
      - BUILD_DOCUMENTATION OFF
      - BUILD_TESTING OFF
      - BUILD_EXAMPLES OFF
      - BUILD_BENCHMARKS OFF
      - BUILD_SHARED_LIBS OFF
    GLOG_CPM_GITHUB_REPO: google/glog
    GLOG_CPM_GIT_TAG: v0.5.0
    GLOG_CPM_OPTIONS:
      - BUILD_SHARED_LIBS OFF
      - WITH_GFLAGS OFF
      - WITH_GTEST OFF
      - WITH_PKGCONFIG OFF
      - WITH_SYMBOLIZE OFF
      - WITH_UNWIND OFF
      - BUILD_TESTING OFF

Clipp:
  modes: [conan, cpm, system]
  conan_requires:
    - clipp/1.2.3
  cmake_vars:
    CPM_GITHUB_REPO: GerHobbelt/clipp
    CPM_GIT_TAG: master

Csv:
  modes: [cpm]
  conan_requires: []
  cmake_vars:
    CPM_GITHUB_REPO: vincentlaucsb/csv-parser
    CPM_GIT_TAG: "2.3.0"

Eigen3:
  modes: [conan, cpm, system]
  conan_requires:
    - eigen/3.4.0
  cmake_vars:
    CPM_URL: https://gitlab.com/libeigen/eigen/-/archive/3.4.1/eigen-3.4.1.tar.gz
    CPM_OPTIONS:
      - BUILD_TESTING OFF
      - EIGEN_BUILD_DOC OFF
      - EIGEN_BUILD_PKGCONFIG OFF
      - EIGEN_BUILD_BTL OFF
      - EIGEN_LEAVE_TEST_IN_ALL_TARGET OFF

Enum:
  modes: [cpm]
  conan_requires: []
  cmake_vars:
    META_ENUM_CPM_GITHUB_REPO: Jerry-Ma/meta_enum
    META_ENUM_CPM_GIT_TAG: master
    BITMASK_CPM_GITHUB_REPO: oliora/bitmask
    BITMASK_CPM_GIT_TAG: master

Grppi:
  modes: [cpm]
  conan_requires: []
  cmake_vars:
    CPM_GITHUB_REPO: Jerry-Ma/grppi
    CPM_GIT_TAG: cpp20

logging:
  modes: [conan, cpm, system]
  conan_requires:
    - spdlog/1.15.3
  cmake_vars:
    SPDLOG_GIT_TAG: v1.x
    SPDLOG_GITHUB_REPO: gabime/spdlog
    SPDLOG_OPTIONS:
      - SPDLOG_FMT_EXTERNAL ON
      - SPDLOG_INSTALL ON

NetCDF:
  modes: [conan, system]
  conan_requires:
    - netcdf/4.8.1
  cmake_vars: {}

NetCDFCXX4:
  modes: [cpm, system]
  conan_requires: []
  cmake_vars:
    CPM_GITHUB_REPO: Unidata/netcdf-cxx4
    CPM_GIT_TAG: main
    CPM_OPTIONS:
      - ENABLE_DOXYGEN OFF
      - BUILD_SHARED_LIBS OFF
      - NCXX_ENABLE_TESTS OFF
      - ENABLE_COVERAGE_TESTS OFF
      - ENABLE_LARGE_FILE_TESTS OFF

perflibs:
  modes: [system]
  conan_requires: []
  cmake_vars: {}

Spectra:
  modes: [conan, cpm, system]
  conan_requires:
    - spectra/1.0.1
  cmake_vars:
    CPM_GITHUB_REPO: yixuan/spectra
    CPM_GIT_TAG: v1.0.1
    CPM_OPTIONS:
      - BUILD_TESTS OFF
      - BUILD_EXAMPLES OFF

testing:
  modes: [conan, cpm, system]
  conan_requires:
    - gtest/1.14.0
    - benchmark/1.8.3
  cmake_vars:
    GTEST_GITHUB_REPO: google/googletest
    GTEST_GIT_TAG: v1.14.0
    GTEST_OPTIONS:
      - BUILD_GMOCK ON
      - INSTALL_GTEST OFF
    BENCHMARK_GITHUB_REPO: google/benchmark
    BENCHMARK_GIT_TAG: v1.8.3
    BENCHMARK_OPTIONS:
      - BENCHMARK_ENABLE_TESTING OFF
      - BENCHMARK_ENABLE_INSTALL OFF

Yaml:
  modes: [conan, cpm, system]
  conan_requires:
    - yaml-cpp/0.8.0
  cmake_vars:
    CPM_GITHUB_REPO: jbeder/yaml-cpp
    CPM_GIT_TAG: "0.8.0"
    CPM_OPTIONS:
      - YAML_CPP_BUILD_TESTS OFF
      - YAML_CPP_BUILD_TOOLS OFF
      - YAML_CPP_BUILD_CONTRIB OFF
      - YAML_CPP_INSTALL ON
