spack:
  include:
    - ../../../acceptance/config/repos.yaml
    - ../../../acceptance/config/devcontainer/packages.yaml

  specs:
    - tlaloc@1.0.0 %cxx=clang@20.1.2

  concretizer:
    unify: true
    reuse: false

  view:
    default:
      root: .spack-view
      link: roots

  develop:
    tula-cmake:
      spec: tula-cmake@3.2.0
      path: ../../../..
    tlaloc:
      spec: tlaloc@1.0.0
      path: ../../../../../tlaloc
    tula:
      spec: tula@3.1.0
      path: ../../../../../tula
    tula-logging:
      spec: tula-logging@1.0.0
      path: ../../../../packages/tula_logging
    tula-yaml-cpp:
      spec: tula-yaml-cpp@0.8.0
      path: ../../../../packages/tula_yaml_cpp
    tula-eigen3:
      spec: tula-eigen3@3.4.0
      path: ../../../../packages/tula_eigen3
    tula-netcdf-cxx4:
      spec: tula-netcdf-cxx4@4.3.1
      path: ../../../../packages/tula_netcdf_cxx4

  packages:
    gcc:
      externals:
      - spec: gcc@14.2.0 languages:='c,c++'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-14
            cxx: /usr/bin/g++-14
    llvm:
      externals:
      - spec: llvm@20.1.2+clang~flang~lld~lldb
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/clang-20
            cxx: /usr/bin/clang++-20
    cxx:
      require: llvm@20.1.2
