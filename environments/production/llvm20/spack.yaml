spack:
  include:
    - ../config/repos.yaml
    - ../config/devcontainer/packages.yaml

  specs:
    - citlali@4.0.0 %cxx=llvm@20.1.2

  concretizer:
    unify: true
    reuse: false

  view:
    default:
      root: .spack-view
      link: roots

  develop:
    citlali:
      spec: citlali@4.0.0
      path: ../../../../citlali
    kidscpp:
      spec: kidscpp@3.1.0
      path: ../../../../kidscpp
    tula-cmake:
      spec: tula-cmake@3.2.0
      path: ../../..
    tula-cfitsio:
      spec: tula-cfitsio@1.0.0
      path: ../../../packages/tula_cfitsio
    tula-perflibs:
      spec: tula-perflibs@0.1.0
      path: ../../../packages/tula_perflibs
    tula-logging:
      spec: tula-logging@1.0.0
      path: ../../../packages/tula_logging
    tula-yaml-cpp:
      spec: tula-yaml-cpp@0.8.0
      path: ../../../packages/tula_yaml_cpp
    tula-eigen3:
      spec: tula-eigen3@3.4.0
      path: ../../../packages/tula_eigen3
    tula-netcdf-cxx4:
      spec: tula-netcdf-cxx4@4.3.1
      path: ../../../packages/tula_netcdf_cxx4
    tula:
      spec: tula@3.1.0
      path: ../../../../tula

  packages:
    cxx:
      require: llvm@20.1.2
